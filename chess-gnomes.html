<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steampunk Gnomes | Checkmate Curiosities</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css-brand.css">
    <style>
        /* 1. Fix Margins */
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px; /* Creates the left/right margin */
            display: flex;
            align-items: center;
            height: 60px;
        }

        /* 2. Center the Text Block */
        .content-header {
            display: block;        /* Switch to block for margin auto to work */
            text-align: center;    /* Centers the inline text and the h1 */
            padding: 60px 25px;    /* Added more top padding for breathing room */
            margin-left: auto;     /* Forces the left margin to push to center */
            margin-right: auto;    /* Forces the right margin to push to center */
            width: 100%;           /* Ensures it takes the full width to find the center */
            max-width: 900px;      /* Prevents text from being too long on wide screens */
        }
        
        .content-header h1, 
        .content-header p {
            margin-left: auto;
            margin-right: auto;
            text-align: center;    /* Explicitly center both lines */
        }
        
        .gallery-grid {
            display: grid;
            /* Changed to fixed width (300px) instead of 1fr to prevent stretching */
            grid-template-columns: repeat(auto-fit, 300px); 
            gap: 30px;
            justify-content: center; /* Centers the entire grid on the page */
            padding: 20px;
        }
        .gallery-item img {
            width: 300px;
            height: 400px;
            object-fit: contain; /* Essential: Ensures no cropping of pieces */
            background-color: #f8f8f8;
            margin-bottom: 1rem;
        }
        div {
            text-align: center;
        }
    </style>
</head>
<body class="page--checkmate">
    <nav class="site-nav"><div class="nav-container"><a href="checkmate-curiosities.html">← Back to Chess Art</a></div></nav>
    <main class="container text-center">
        <h1 class="playfair">Steampunk Gnomes</h1>
        <p>A conflict of brass and gears. One-of-a-kind originals.</p>
        <div class="grid-three-col">
            <div class="gallery-item"><img src="images/king.png" alt="Gnome King"></div>
            <div class="gallery-item"><img src="images/queen.png" alt="Gnome Queen"></div>
            <div class="gallery-item"><img src="images/bishop1.png" alt="Gnome Pawn"></div>
            <div class="gallery-item"><img src="images/violetBishop.png" alt="Gnome King"></div>
            <div class="gallery-item"><img src="images/Knight1.png" alt="Gnome Queen"></div>
            <div class="gallery-item"><img src="images/Knight2.png" alt="Gnome Pawn"></div>
        </div>
    </main>
</body>
</html>
